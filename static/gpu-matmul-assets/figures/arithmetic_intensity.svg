<text x="44" y="164" font-size="12" fill="#d97706" text-anchor="start" font-weight="normal">→ 1 output</text>
<text x="46" y="356" font-size="13" fill="#64748b" text-anchor="start" font-weight="normal">loads:</text>
<text x="250" y="356" font-size="13" fill="#0f172a" text-anchor="end" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">2K</text>
