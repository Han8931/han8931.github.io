<text x="58" y="348" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#64748b" font-weight="normal">= idle</text>
<text x="24" y="380" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="start" fill="#15803d" font-weight="600">full[i]</text>
<text x="90" y="380" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#0f172a" font-weight="normal">TMA delivered every byte of slot i → the consumer may start its wgmmas on it.</text>
<text x="24" y="404" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="start" fill="#6d28d9" font-weight="600">empty[i]</text>
<text x="90" y="404" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#0f172a" font-weight="normal">consumer finished reading slot i → the producer may refill it (slots wrap 0, 1, 0, 1 …).</text>
<text x="24" y="436.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#64748b" font-weight="normal">Here TMA is the bottleneck, so the queue never fills up and the Tensor Cores still idle between chunks.</text>
<text x="24" y="452.8" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#64748b" font-weight="normal">More slots help absorb jitter, but nothing can beat the speed of the slower side.</text>
