<text x="24" y="36" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" fill="#0f172a" font-weight="600">Circular buffer with 2 SMEM slots (case shown: loads slower than compute)</text>
<text x="24" y="94.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#64748b" font-weight="normal">TMA</text>
