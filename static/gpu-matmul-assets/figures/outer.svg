<svg xmlns="http://www.w3.org/2000/svg" width="800" height="484" viewBox="0 0 800 484" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-idle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f1f5f9"/><line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="2"/></pattern></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="400" y="40" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">Matmul as a sum of outer products (k is the outermost loop)</text>
<text x="400" y="62" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">C  =  A[:,0] ⊗ B[0,:]  +  A[:,1] ⊗ B[1,:]  +  …  +  A[:,K−1] ⊗ B[K−1,:]</text>
<rect x="30" y="84" width="236" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/>
<text x="44" y="110" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold">Step 1: k = 0</text>
<text x="44" y="128" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">column 0 of A ⊗ row 0 of B</text>
<rect x="156" y="158" width="96" height="96" rx="1" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
<text x="156" y="152" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">B</text>
<rect x="46" y="274" width="96" height="96" rx="1" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
<text x="46" y="268" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">A</text>
<rect x="156" y="274" width="96" height="96" rx="1" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
<text x="156" y="268" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">C</text>
<rect x="46" y="274" width="8" height="96" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
<rect x="156" y="158" width="96" height="8" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
<rect x="156" y="274" width="96" height="96" rx="1" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<rect x="46" y="290" width="8" height="8" rx="0" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<rect x="180" y="158" width="8" height="8" rx="0" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<rect x="180" y="290" width="8" height="8" rx="0" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<line x1="46" y1="294.0" x2="142" y2="294.0" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="184.0" y1="158" x2="184.0" y2="254" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="44" y="160" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">every C cell</text>
<text x="44" y="176" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">gets one</text>
<text x="44" y="192" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">product added</text>
<text x="44" y="218" font-size="12" fill="#0f172a" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">C[2,3] +=</text>
<text x="44" y="234" font-size="12" fill="#2563eb" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">A[2,0]·</text>
<text x="44" y="250" font-size="12" fill="#2563eb" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">B[0,3]</text>
<rect x="286" y="84" width="236" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/>
<text x="300" y="110" font-size="14" fill="#7c3aed" text-anchor="start" font-weight="bold">Step 2: k = 1</text>
<text x="300" y="128" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">column 1 of A ⊗ row 1 of B</text>
<rect x="412" y="158" width="96" height="96" rx="1" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
<text x="412" y="152" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">B</text>
<rect x="302" y="274" width="96" height="96" rx="1" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
<text x="302" y="268" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">A</text>
<rect x="412" y="274" width="96" height="96" rx="1" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
<text x="412" y="268" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">C</text>
<rect x="310" y="274" width="8" height="96" rx="0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
<rect x="412" y="166" width="96" height="8" rx="0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
<rect x="412" y="274" width="96" height="96" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
<rect x="310" y="290" width="8" height="8" rx="0" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="436" y="166" width="8" height="8" rx="0" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="436" y="290" width="8" height="8" rx="0" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<line x1="302" y1="294.0" x2="398" y2="294.0" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="440.0" y1="158" x2="440.0" y2="254" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="300" y="160" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">every C cell</text>
<text x="300" y="176" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">gets one</text>
<text x="300" y="192" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">product added</text>
<text x="300" y="218" font-size="12" fill="#0f172a" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">C[2,3] +=</text>
<text x="300" y="234" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">A[2,1]·</text>
<text x="300" y="250" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">B[1,3]</text>
<rect x="542" y="84" width="236" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/>
<text x="556" y="110" font-size="14" fill="#16a34a" text-anchor="start" font-weight="bold">Step K: k = K−1</text>
<text x="556" y="128" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">column K−1 of A ⊗ row K−1 of B</text>
<rect x="668" y="158" width="96" height="96" rx="1" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
<text x="668" y="152" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">B</text>
<rect x="558" y="274" width="96" height="96" rx="1" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
<text x="558" y="268" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">A</text>
<rect x="668" y="274" width="96" height="96" rx="1" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
<text x="668" y="268" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">C</text>
<rect x="646" y="274" width="8" height="96" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
<rect x="668" y="246" width="96" height="8" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
<rect x="668" y="274" width="96" height="96" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<rect x="646" y="290" width="8" height="8" rx="0" fill="#16a34a" stroke="#16a34a" stroke-width="1.5"/>
<rect x="692" y="246" width="8" height="8" rx="0" fill="#16a34a" stroke="#16a34a" stroke-width="1.5"/>
<rect x="692" y="290" width="8" height="8" rx="0" fill="#16a34a" stroke="#16a34a" stroke-width="1.5"/>
<line x1="558" y1="294.0" x2="654" y2="294.0" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="696.0" y1="158" x2="696.0" y2="254" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="556" y="160" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">every C cell</text>
<text x="556" y="176" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">gets one</text>
<text x="556" y="192" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">product added</text>
<text x="556" y="218" font-size="12" fill="#0f172a" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">C[2,3] +=</text>
<text x="556" y="234" font-size="12" fill="#16a34a" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">A[2,K−1]·</text>
<text x="556" y="250" font-size="12" fill="#16a34a" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">B[K−1,3]</text>
<text x="400" y="414" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">Following one cell, C[2,3]:</text>
<text x="400" y="438" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">C[2,3] = <tspan fill="#2563eb" font-weight="bold">A[2,0]·B[0,3]</tspan> + <tspan fill="#7c3aed" font-weight="bold">A[2,1]·B[1,3]</tspan> + … + <tspan fill="#16a34a" font-weight="bold">A[2,K−1]·B[K−1,3]</tspan></text>
<text x="400" y="464" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">Same dot product as before, just accumulated one k at a time across the whole matrix.</text>
</svg>
