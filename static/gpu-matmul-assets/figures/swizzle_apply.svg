<text x="40.0" y="470.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#0f172a" font-weight="normal">(3,0): bytes 384–399 = 0b1_1000_0000 …  XOR 0b0110000  →  432–447 = slot 3  (moves 3 slots right)</text>
<text x="40.0" y="486.8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#0f172a" font-weight="normal">(3,1): bytes 400–415  XOR 48  →  416–431 = slot 2  (moves 1 slot right)</text>
<text x="40.0" y="516.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#16a34a" font-weight="normal">Shortcut: within a row, slot = c XOR r. Row 3 becomes 3,2,1,0,7,6,5,4.</text>
