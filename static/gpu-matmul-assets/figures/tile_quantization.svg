<text x="540" y="190" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold">Edge blocks hang off the matrix.</text>
<text x="540" y="210" font-size="12" fill="#0f172a" text-anchor="start" font-weight="normal">Their out-of-bounds threads fail</text>
<text x="540" y="226" font-size="12" fill="#0f172a" text-anchor="start" font-weight="normal">the if (row &lt; M &amp;&amp; col &lt; N) check</text>
<text x="540" y="242" font-size="12" fill="#0f172a" text-anchor="start" font-weight="normal">and exit immediately, but the</text>
<text x="540" y="258" font-size="12" fill="#0f172a" text-anchor="start" font-weight="normal">block still takes up an SM slot.</text>
<rect x="90" y="498" width="16" height="16" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
<text x="114" y="511" font-size="12" fill="#0f172a" text-anchor="start" font-weight="normal">threads doing useful work</text>
<rect x="320" y="498" width="16" height="16" rx="2" fill="url(#hatch)" stroke="#94a3b8" stroke-width="1"/>
<text x="344" y="511" font-size="12" fill="#0f172a" text-anchor="start" font-weight="normal">wasted threads (matrix size not a multiple of the tile size)</text>
