="526" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="566" y="526" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="588" y="526" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="500" y="548" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="522" y="548" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="544" y="548" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="566" y="548" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="588" y="548" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="500" y="570" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="522" y="570" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="544" y="570" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="566" y="570" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="588" y="570" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="500" y="592" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="522" y="592" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="544" y="592" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="566" y="592" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="588" y="592" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><line x1="511" y1="508" x2="511" y2="610" stroke="#dc2626" stroke-width="2" marker-end="url(#ar-red)" /><line x1="533" y1="508" x2="533" y2="610" stroke="#dc2626" stroke-width="2" marker-end="url(#ar-red)" /><line x1="555" y1="508" x2="555" y2="610" stroke="#dc2626" stroke-width="2" marker-end="url(#ar-red)" /><text x="624" y="544" class="s12 tr">addresses +1024 B, …</text><text x="400" y="640" class="mono s12 mut c">A[row][col] lives at address A + 4·(row·N + col)</text></svg>