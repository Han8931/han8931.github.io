</style><rect width="100%" height="100%" fill="#ffffff" /><text x="24" y="32" class="b">A 256×256 float matrix, stored row-major</text><rect x="60" y="70" width="200" height="200" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5" /><rect x="60" y="70" width="200" height="22" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" /><rect x="60" y="92" width="200" height="22" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" /><rect x="60" y="248" width="200" height="22" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" /><text x="160.0" y="185" class="s16 mut c">⋮</text><text x="52" y="86" class="s12 mut r">0</text><text x="52" y="108" class="s12 mut r">1</text><text x="52" y="264" class="s12 mut r">255</text><text x="60" y="62" class="s12 mut">0</text><text x="260" y="62" class="s12 mut r">255</text><text x="160.0" y="62" class="s12 mut c">col →</text><line x1="276" y1="170" x2="420" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#ar-ink)" /><text x="345" y="152" class="s12 c">rows laid out</text><text x="345" y="198" class="s12 c">end to end</text><rect x="440" y="50" width="330" height="240" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" /><text x="605.0" y="40" class="s12 b c">GMEM (one long line of addresses)</text><rect x="456" y="70" width="298" height="34" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" /><text x="605.0" y="92" class="s12 c">row 0 · bytes 0 – 1023</text><rect x="456" y="114" width="298" height="34" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" /><text x="605.0" y="136" class="s12 c">row 1 · bytes 1024 – 2047</text><text x="605.0" y="188" class="s16 mut c">⋮</text><rect x="456" y="214" width="298" height="34" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" /><text x="605.0" y="236" class="s12 c">row 255 · bytes 261,120 – 262,143</text><text x="605.0" y="280" class="s12 tg c">256 floats × 4 B = 1024 B per matrix row</text><rect x="24" y="340" width="340" height="140" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2" /><text x="40" y="366" class="b s12 tg">✓ Row by row (col is the inner loop)</text><text x="40" y="394" class="mono s12" xml:space="preserve">for (row = 0; row &lt; M; row++)</text><text x="40" y="414" class="mono s12" xml:space="preserve">  for (col = 0; col &lt; N; col++)</text><text x="40" y="434" class="mono s12" xml:space="preserve">    load(A[row][col]);</text><text x="40" y="466" class="s12 tg">neighbors in a row → 4-byte address stride</text><rect x="436" y="340" width="340" height="140" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2" /><text x="452" y="366" class="b s12 tr">✗ Column by column (row is the inner loop)</text><text x="452" y="394" class="mono s12" xml:space="preserve">for (col = 0; col &lt; N; col++)</text><text x="452" y="414" class="mono s12" xml:space="preserve">  for (row = 0; row &lt; M; row++)</text><text x="452" y="434" class="mono s12" xml:space="preserve">    load(A[row][col]);</text><text x="452" y="466" class="s12 tr">down a column → 1024-byte address stride</text><rect x="90" y="504" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="112" y="504" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="134" y="504" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="156" y="504" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="178" y="504" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="90" y="526" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="112" y="526" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="134" y="526" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="156" y="526" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="178" y="526" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="90" y="548" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" /><rect x="112" y="548" width="22" height="22" fill="#ff