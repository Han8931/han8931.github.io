<text x="55" y="452" font-size="18" style="fill:#0f172a" font-weight="400" text-anchor="start" class="mono">col = blockIdx.x × blockDim.x + threadIdx.x = 1×2 + 1 = 3</text>
<text x="55" y="484" font-size="18" style="fill:#0f172a" font-weight="400" text-anchor="start" class="mono">row = blockIdx.y × blockDim.y + threadIdx.y = 0×2 + 0 = 0</text>
<text x="55" y="521" font-size="16" style="fill:#475569" font-weight="400" text-anchor="start">This thread computes the whole dot product for C[0,3], not just one term.</text>
<text x="32" y="574" font-size="15" style="fill:#475569" font-weight="400" text-anchor="start">These tiny blocks explain indexing. The runnable example uses 16×16 blocks.</text>
