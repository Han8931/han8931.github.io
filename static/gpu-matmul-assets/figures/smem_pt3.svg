x="256" y="74" class="s12 c">T3</text><line x1="256" y1="84" x2="126.0" y2="136" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar-blue)"/><rect x="286" y="56" width="40" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="306" y="74" class="s12 c">T4</text><line x1="306" y1="84" x2="126.0" y2="136" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar-blue)"/><text x="356" y="66" class="s12">T0–T2 read bank 0's word (bytes 0–3),</text><text x="356" y="84" class="s12">T3–T4 read bank 1's word (bytes 4–7).</text><text x="356" y="108" class="s12 tg">Same address in a bank = no conflict: the value is</text><text x="356" y="126" class="s12 tg">fetched once and multicast to every thread that wants it.</text><rect x="24" y="296" width="752" height="58" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="40" y="320" class="s12 b">Rule of thumb: conflicts only happen for different addresses in the same bank.</text><text x="40" y="340" class="s12">Same word → broadcast. Different banks → no bank-conflict serialization.</text></svg>