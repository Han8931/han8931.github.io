.tb{fill:#2563eb}.tr{fill:#dc2626}.ta{fill:#b45309}.tg{fill:#15803d}.tp{fill:#6d28d9}
</style><rect width="100%" height="100%" fill="#ffffff" /><text x="24" y="30" class="b">How a cache reads a GMEM address (example: 4-way, 1024 sets, 128 B lines)</text><rect x="120" y="70" width="300" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" /><text x="270.0" y="95" class="b c">tag</text><text x="270.0" y="62" class="s11 mut c">remaining high bits</text><rect x="420" y="70" width="150" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" /><text x="495.0" y="95" class="b c">set index</text><text x="495.0" y="62" class="s11 mut c">10 bits → 1024 sets</text><rect x="570" y="70" width="130" height="40" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" /><text x="635.0" y="95" class="b c">offset</text><text x="635.0" y="62" class="s11 mut c">7 bits → byte in 128 B line</text><text x="110" y="95" class="s12 mut r">address</text><text x="635" y="128" class="s11 tp c">= 2-bit sector id + 5-bit byte</text><text x="108" y="206" class="s12 mut r">set 0</text><rect x="120" y="170" width="220" height="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" /><text x="332" y="182" class="s11 mut r">way 0</text><rect x="120" y="186" width="220" height="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" /><text x="332" y="198" class="s11 mut r">way 1</text><rect x="120" y="202" width="220" height="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" /><text x="332" y="214" class="s11 mut r">way 2</text><rect x="120" y="218" width="220" height="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" /><text x="332" y="230" class="s11 mut r">way 3</text><text x="108" y="282" class="s12 b r">set 1</text><rect x="120" y="246" width="220" height="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8" /><text x="332" y="258" class="s11 mut r">way 0</text><rect x="120" y="262" width="220" height="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8" /><text x="332" y="274" class="s11 mut r">way 1</text><rect x="120" y="278" width="220" height="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8" /><text x="332" y="290" class="s11 mut r">way 2</text><rect x="120" y="294" width="220" height="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8" /><text x="332" y="306" class="s11 mut r">way 3</text><text x="230.0" y="342" class="s16 mut c">⋮</text><text x="108" y="402" class="s12 mut r">set 1023</text><rect x="120" y="366" width="220" height="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" /><text x="332" y="378" class="s11 mut r">way 0</text><rect x="120" y="382" width="220" height="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" /><text x="332" y="394" class="s11 mut r">way 1</text><rect x="120" y="398" width="220" height="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" /><text x="332" y="410" class="s11 mut r">way 2</text><rect x="120" y="414" width="220" height="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" /><text x="332" y="426" class="s11 mut r">way 3</text><text x="230.0" y="454" class="s12 mut c">each set holds 4 lines (“ways”)</text><path d="M 495.0 110 L 495.0 140 L 380 140 L 380 278 L 344 278" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ar-blue)" /><text x="370" y="160" class="s12 tb b r">① set index picks the set</text><text x="420" y="286" class="s12 b">Inside one cache line</text><rect x="420" y="300" width="70" height="34" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.5" /><text x="455.0" y="322" class="s12 c">flags</text><rect x="490" y="300" width="90" height="34" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" /><text x="535.0" y="322" class="s12 c">tag</text><rect x="580" y="300" width="50" height="34" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" /><text x="605.0" y="322" class="s12 c">s0</text><rect x="630" y="300" width="50" height="34" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" /><text x="655.0" y="322" class="s12 c">s1</text><rect x="680" y="300" width="50" height="34" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" /><text x="705.0" y="322" class="s12 c">s2</text><rect x="730" y="300" width="50" height="34" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" /><text x="755.0" y="322" class="s12 c">s3</text><text x="680" y="354" class="s11 tp c">4 sectors × 32 B = 128 B of data</text><text x="455" y="354" class="s11 mut c">valid, dirty…</text><line x1="340" y1="270.0" x2="416" y2="317" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4" /><text x="420" y="160" class="s12 b">② compare the address tag with</text><text x="420" y="178" class="s12 b">     the 4 tags in that set (in parallel)</text><text x="420" y="206" class="s12 tg">③ match → hit: use the offset to read bytes</text><text x="420" y="228" class="s12 tr">     no match → miss: fetch from L2, evict one</text><text x="420" y="246" class="s12 tr">     of the 4 ways (e.g. least recently used)</text><rect x="24" y="488" width="772" height="112" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4" /><text x="40" y="512" class="s12 b tg">Typical flags (generic; NVIDIA's exact bits aren't public)</text><text x="40" y="536" class="s12">valid — the line holds data   ·   dirty — modified data awaits writeback (generic examples)</text><text x="40" y="556" class="s12">Why k-way? 1-way is fast but conflicts a lot; fully associative is flexible but expensive. k-way is the compromise.</text><text x="40" y="576" class="s12 mut">Real example: V100's L2 is 16-way, 6,144 KiB, 64 B lines, ~193-cycle latency (Jia et al., microbenchmarking paper).</text></svg>