<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <style>
    text { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0f172a; }
    .muted { fill: #64748b; }
    .lane { font-size: 15px; font-weight: 600; }
    .dim { font-size: 12px; text-anchor: middle; fill: #334155; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="24" y="36" style="font-size:14px">Max clock on H100 SXM is <tspan font-weight="600">1830 MHz</tspan>, so one clock cycle takes ≈ 0.55 ns.</text>
  <text x="24" y="58" style="font-size:13px" class="muted">Under heavy load the GPU may power-throttle: it lowers the clock to cut transistor switching power.</text>
  <text x="24" y="78" style="font-size:13px" class="muted">How much depends on the data: random bits toggle more transistors than all-zeros.</text>

  <!-- wave 1 -->
  <text class="lane" x="24" y="152">1830 MHz</text>
  <text x="24" y="170" style="font-size:12px" class="muted">normal</text>
  <line x1="104" y1="196" x2="612" y2="196" stroke="#475569" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="612" y="214" style="font-size:12px; text-anchor:end" class="muted">time →</text>
  <path d="M110,180 V130 h82.5 v50 h82.5 v-50 h82.5 v50 h82.5 v-50 h82.5 v50 h82.5" fill="none" stroke="#dc2626" stroke-width="2"/>
  <line x1="110" y1="120" x2="110" y2="226" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <line x1="275" y1="120" x2="275" y2="226" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <line x1="114" y1="220" x2="271" y2="220" stroke="#334155" stroke-width="1.2" marker-start="url(#ad)" marker-end="url(#ad)"/>
  <text class="dim" x="192" y="238">0.55 ns per cycle</text>
  <rect x="628" y="122" width="148" height="66" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="702" y="147" style="font-size:12px; text-anchor:middle" class="muted">speed of light</text>
  <text x="702" y="174" style="font-size:18px; font-weight:700; text-anchor:middle">989 TFLOP/s</text>

  <!-- throttle arrow -->
  <line x1="355" y1="256" x2="355" y2="294" stroke="#475569" stroke-width="2" marker-end="url(#ag)"/>
  <text x="370" y="280" style="font-size:14px; font-weight:600">power throttling</text>

  <!-- wave 2 -->
  <text class="lane" x="24" y="342">1000 MHz</text>
  <text x="24" y="360" style="font-size:12px" class="muted">throttled</text>
  <line x1="104" y1="386" x2="612" y2="386" stroke="#475569" stroke-width="1.5" marker-end="url(#ag)"/>
  <path d="M110,370 V320 h150 v50 h150 v-50 h150 v50 h45" fill="none" stroke="#dc2626" stroke-width="2"/>
  <line x1="110" y1="310" x2="110" y2="416" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <line x1="410" y1="310" x2="410" y2="416" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <line x1="114" y1="410" x2="406" y2="410" stroke="#334155" stroke-width="1.2" marker-start="url(#ad)" marker-end="url(#ad)"/>
  <text class="dim" x="260" y="428">1 ns per cycle</text>
  <rect x="628" y="312" width="148" height="66" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="702" y="337" style="font-size:12px; text-anchor:middle" class="muted">new speed of light</text>
  <text x="702" y="364" style="font-size:18px; font-weight:700; text-anchor:middle">541 TFLOP/s</text>

  <text x="400" y="462" style="font-size:12px; text-anchor:middle" class="muted">Same chip, same kernel: peak scales directly with clock (528 TCs × 1024 FLOPs × 1.0 GHz ≈ 541 TFLOP/s).</text>
</svg>
