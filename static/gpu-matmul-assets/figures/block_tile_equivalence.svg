<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb" /></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626" /></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706" /></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a" /></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed" /></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569" /></marker><marker id="ah-idle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8" /></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f1f5f9" /><line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="2" /></pattern></defs>
<rect width="100%" height="100%" fill="#ffffff" />
<rect x="24" y="20" width="752" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
<text x="44" y="50" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">Naive: one long dot product over all of K</text>
<text x="60" y="84" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">row 0 of A</text>
<rect x="60" y="92" width="440" height="26" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
<text x="60" y="140" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">column 0 of B (drawn sideways)</text>
<rect x="60" y="148" width="440" height="26" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
<path d="M 60 192 L 500 192" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ah-slate)" />
<text x="280.0" y="210" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">k = 0 … K−1</text>
<path d="M 516 134 L 564 134" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#ah-amber)" />
<rect x="574" y="116" width="36" height="36" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
<text x="620" y="128" font-size="13" fill="#0f172a" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">C[0][0]</text>
<text x="620" y="146" font-size="11" fill="#64748b" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">tmp += A[0,k]·B[k,0]</text>
<rect x="24" y="244" width="752" height="296" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
<text x="44" y="274" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">Tiled: the same dot product, as K/BK partial sums</text>
<text x="60" y="308" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">row 0 of A</text>
<rect x="60.0" y="316" width="110.0" height="26" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
<text x="115.0" y="333" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="normal">chunk 0</text>
<rect x="170.0" y="316" width="110.0" height="26" rx="0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" />
<text x="225.0" y="333" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="normal">chunk 1</text>
<rect x="280.0" y="316" width="110.0" height="26" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
<text x="335.0" y="333" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="normal">chunk 2</text>
<rect x="390.0" y="316" width="110.0" height="26" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
<text x="445.0" y="333" font-size="12" fill="#d97706" text-anchor="middle" font-weight="normal">chunk 3</text>
<text x="60" y="364" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">column 0 of B</text>
<rect x="60.0" y="372" width="110.0" height="26" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
<rect x="170.0" y="372" width="110.0" height="26" rx="0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" />
<rect x="280.0" y="372" width="110.0" height="26" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
<rect x="390.0" y="372" width="110.0" height="26" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
<line x1="62.0" y1="406" x2="168.0" y2="406" stroke="#2563eb" stroke-width="2" />
<line x1="172.0" y1="406" x2="278.0" y2="406" stroke="#7c3aed" stroke-width="2" />
<line x1="282.0" y1="406" x2="388.0" y2="406" stroke="#16a34a" stroke-width="2" />
<line x1="392.0" y1="406" x2="498.0" y2="406" stroke="#d97706" stroke-width="2" />
<text x="115.0" y="424" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">BK elements</text>
<text x="60" y="466" font-size="13" fill="#0f172a" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">C[0][0] =</text>
<rect x="142" y="451" width="20" height="20" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
<text x="172" y="466" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="normal">+</text>
<rect x="184" y="451" width="20" height="20" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" />
<text x="214" y="466" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="normal">+</text>
<rect x="226" y="451" width="20" height="20" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
<text x="256" y="466" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="normal">+</text>
<rect x="268" y="451" width="20" height="20" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
<text x="304" y="466" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">(one partial sum per chunk)</text>
<text x="60" y="496" font-size="12" fill="#0f172a" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">for each chunk:  load A/B chunk → SMEM;  tmp += Σ A[0,k]·B[k,0] over that chunk</text>
<text x="60" y="518" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">BK is chosen so a BM×BK tile of A and a BK×BN tile of B fit in shared memory.</text>
<text x="528" y="336" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">e.g. d0+d1+…+d7 =</text>
<text x="528" y="354" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">(d0+d1)+(d2+d3)</text>
<text x="528" y="372" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">+(d4+d5)+(d6+d7)</text>
<text x="528" y="396" font-size="12" fill="#16a34a" text-anchor="start" font-weight="normal">Same real-arithmetic sum;</text>
<text x="528" y="412" font-size="12" fill="#16a34a" text-anchor="start" font-weight="normal">rounding may differ.</text>
</svg>