<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <style>
    text { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0f172a; }
    .muted { fill: #64748b; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  </style>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- regions -->
  <polygon points="80,400 360,110 560,110 560,400" fill="#f8fafc"/>
  <rect x="360" y="110" width="200" height="40" fill="#dcfce7" stroke="#16a34a" stroke-dasharray="5 3"/>
  <text x="460" y="135" style="font-size:13px; text-anchor:middle; fill:#15803d; font-weight:600">compute ceiling</text>

  <!-- axes -->
  <line x1="80" y1="420" x2="80" y2="50" stroke="#475569" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="70" y1="400" x2="580" y2="400" stroke="#475569" stroke-width="1.5" marker-end="url(#ax)"/>
  <text x="320" y="430" style="font-size:13px; text-anchor:middle">arithmetic intensity (FLOP/byte, log scale)</text>
  <text transform="translate(52,230) rotate(-90)" style="font-size:13px; text-anchor:middle">performance (FLOP/s, log scale)</text>

  <!-- roofs -->
  <line x1="80" y1="400" x2="360" y2="110" stroke="#2563eb" stroke-width="3"/>
  <line x1="360" y1="110" x2="560" y2="110" stroke="#dc2626" stroke-width="3"/>
  <line x1="360" y1="110" x2="360" y2="400" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <circle cx="360" cy="110" r="7" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="352" y="96" style="font-size:13px; text-anchor:end; font-weight:600">ridge point</text>

  <text transform="translate(196,252) rotate(-46)" style="font-size:13px; fill:#1d4ed8; font-weight:600; text-anchor:middle">memory roof: intensity × bandwidth</text>
  <text x="560" y="100" style="font-size:13px; fill:#b91c1c; font-weight:600; text-anchor:end">compute roof (chosen FP32 path)</text>

  <text x="170" y="120" style="font-size:13px; text-anchor:middle" class="muted">unattainable</text>
  <text x="200" y="385" style="font-size:13px; text-anchor:middle; fill:#1d4ed8">memory-bound</text>
  <text x="460" y="385" style="font-size:13px; text-anchor:middle; fill:#b91c1c">compute-bound</text>

  <!-- naive kernels -->
  <circle cx="160" cy="352" r="6" fill="#94a3b8" stroke="#334155"/>
  <circle cx="185" cy="318" r="6" fill="#94a3b8" stroke="#334155"/>
  <path d="M250,300 Q220,300 196,314" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="256" y="296" style="font-size:12px; fill:#b91c1c">illustrative points below</text>
  <text x="256" y="312" style="font-size:12px; fill:#b91c1c">the bandwidth ceiling</text>

  <!-- ridge computation panel -->
  <rect x="596" y="150" width="184" height="180" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="608" y="174" style="font-size:13px; font-weight:600">Illustrative FP32 model</text>
  <text xml:space="preserve" x="608" y="200" class="mono" style="font-size:11.5px">peak  = 60 TFLOP/s</text>
  <text xml:space="preserve" x="608" y="216" class="mono" style="font-size:11.5px">bw    = 2 TB/s</text>
  <text xml:space="preserve" x="608" y="232" class="mono" style="font-size:11.5px"></text>
  <text xml:space="preserve" x="608" y="256" class="mono" style="font-size:11.5px">same memory boundary</text>
  <text xml:space="preserve" x="608" y="282" class="mono" style="font-size:11.5px">ridge = peak / bw</text>
  <text xml:space="preserve" x="608" y="304" class="mono" style="font-size:12px; font-weight:700">      = 30 FLOP/byte</text>
  <text x="608" y="322" style="font-size:11px" class="muted">not a device specification</text>

  <text x="400" y="470" style="font-size:12px; text-anchor:middle" class="muted">Achieved FLOP/s ≤ min(compute peak, intensity × bandwidth). Both are upper bounds.</text>
</svg>
