<text x="552" y="196" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1d4ed8" font-weight="normal">A: own</text>
<text x="734" y="196" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" fill="#1d4ed8" font-weight="normal">A: own</text>
<text x="24" y="470.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#0f172a" font-weight="normal">• The two output tiles share the same B chunk but each needs its own A chunk.</text>
<text x="24" y="486.8" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#0f172a" font-weight="normal">• One SM loads B once and TMA multicasts it into both SMs&#x27; shared memory: one fewer L2/GMEM load.</text>
<text x="24" y="503.6" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#0f172a" font-weight="normal">• Together the cluster computes a 256×256 super-tile. (1×2 or 2×2 clusters work the same way.)</text>
<text x="24" y="520.4" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#0f172a" font-weight="normal">• Cost: both blocks must free that SMEM slot (empty barrier) before the multicast, so the SMs sync with each other.</text>
