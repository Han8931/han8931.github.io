<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">A matrix is stored as a sequence of values</title><desc id="desc">A[1,2], whose value is 7, becomes element index 6 and byte offset 24 in a row-major FP32 array.</desc>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#0f172a} .mono{font-family:DejaVu Sans Mono,monospace}</style>
