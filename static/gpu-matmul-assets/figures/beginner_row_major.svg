<text x="362" y="157" font-size="18" style="fill:#d97706" font-weight="700" text-anchor="start">Follow A[1,2], whose stored value is 7</text>
<text x="362" y="194" font-size="20" style="fill:#0f172a" font-weight="400" text-anchor="start" class="mono">element index = 1 × 4 + 2 = 6</text>
<text x="362" y="230" font-size="20" style="fill:#0f172a" font-weight="400" text-anchor="start" class="mono">byte offset   = 6 × 4     = 24</text>
<text x="362" y="257" font-size="15" style="fill:#475569" font-weight="400" text-anchor="start">FP32: four bytes per element; four columns per row.</text>
