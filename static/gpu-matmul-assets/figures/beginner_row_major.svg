<text x="32" y="38" font-size="24" style="fill:#0f172a" font-weight="700" text-anchor="start">A matrix is stored as a sequence of values</text>
<text x="32" y="67" font-size="16" style="fill:#475569" font-weight="400" text-anchor="start">Separate three things: the stored value, its element index, and its byte offset.</text>
<text x="80" y="99" font-size="18" style="fill:#2563eb" font-weight="700" text-anchor="start">Logical A[row,col]</text>
