<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><defs><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb" /></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626" /></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706" /></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a" /></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed" /></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569" /></marker><marker id="ar-idle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8" /></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155" /></marker></defs><style>
text{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0f172a;font-size:14px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.s12{font-size:12px}.s11{font-size:11px}.s16{font-size:16px}.b{font-weight:600}
.mut{fill:#64748b}.c{text-anchor:middle}.r{text-anchor:end}
.tb{fill:#2563eb}.tr{fill:#dc2626}.ta{fill:#b45309}.tg{fill:#15803d}.tp{fill:#6d28d9}
</style><rect width="100%" height="100%" fill="#ffffff" /><rect x="24" y="100" width="104" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" /><text x="76" y="124" class="s12 c">warp</text><text x="76" y="140" class="s12 c">scheduler</text><line x1="128" y1="128" x2="156" y2="128" stroke="#334155" stroke-width="1.5" marker-end="url(#ar-ink)" /><rect x="24" y="178" width="104" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" /><text x="76" y="202" class="s12 c">warp</text><text x="76" y="218" class="s12 c">scheduler</text><line x1="128" y1="206" x2="156" y2="206" stroke="#334155" stroke-width="1.5" marker-end="url(#ar-ink)" /><rect x="24" y="256" width="104" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" /><text x="76" y="280" class="s12 c">warp</text><text x="76" y="296" class="s12 c">scheduler</text><line x1="128" y1="284" x2="156" y2="284" stroke="#334155" stroke-width="1.5" marker-end="url(#ar-ink)" /><rect x="24" y="334" width="104" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" /><text x="76" y="358" class="s12 c">warp</text><text x="76" y="374" class="s12 c">scheduler</text><line x1="128" y1="362" x2="156" y2="362" stroke="#334155" stroke-width="1.5" marker-end="url(#ar-ink)" /><rect x="158" y="100" width="56" height="290" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5" /><text x="186" y="245" class="b c" transform="rotate(-90 186 245)">MIO queue</text><line x1="214" y1="245" x2="274" y2="245" stroke="#334155" stroke-width="2" marker-end="url(#ar-ink)" /><text x="244" y="228" class="s11 mut c">GMEM +</text><text x="244" y="268" class="s11 mut c">SMEM req.</text><rect x="276" y="70" width="600" height="380" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5" /><text x="292" y="94" class="b tb">L1 / texture unit (“L1tex”) — one per SM</text><rect x="296" y="210" width="100" height="70" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5" /><text x="346" y="242" class="b c">LSUIN</text><text x="346" y="262" class="s12 mut c">router</text><rect x="736" y="120" width="120" height="300" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" /><text x="796" y="250" class="b c">data stage</text><text x="796" y="270" class="s12 c">(SRAM)</text><text x="796" y="300" class="s11 mut c">shared by L1</text><text x="796" y="316" class="s11 mut c">and SMEM</text><text x="796" y="332" class="s11 mut c">(256 KiB / SM)</text><line x1="396" y1="225" x2="734" y2="225" stroke="#16a34a" stroke-width="2" marker-end="url(#ar-green)" /><text x="560" y="190" class="s12 tg b c">SMEM requests</text><text x="560" y="208" class="s11 tg c">skip the tag check → a bit faster</text><rect x="456" y="300" width="104" height="54" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" /><text x="508" y="324" class="s12 b c">tag stage</text><text x="508" y="342" class="s11 c">hit or miss?</text><path d="M 346 280 L 346 327 L 454 327" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#ar-ink)" /><text x="352" y="316" class="s11">GMEM requests</text><path d="M 560 312 L 640 312 L 640 270 L 734 270" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ar-green)" /><text x="650" y="262" class="s12 tg b">hit</text><rect x="600" y="372" width="104" height="54" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" /><text x="652" y="396" class="s12 b c">miss stage</text><text x="652" y="414" class="s11 c">fetch from L2</text><path d="M 508 354 L 508 399 L 598 399" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar-red)" /><text x="516" y="388" class="s12 tr b">miss</text><line x1="704" y1="399" x2="734" y2="399" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar-red)" /><text x="712" y="390" class="s11 tr">fill</text><line x1="652" y1="428" x2="652" y2="494" stroke="#334155" stroke-width="1.5" marker-end="url(#ar-ink)" marker-start="url(#ar-ink)" /><rect x="540" y="496" width="224" height="52" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5" /><text x="652" y="518" class="s12 b c">rest of the hierarchy</text><text x="652" y="536" class="s11 mut c">L2 → HBM (and peer GPUs)</text><path d="M 796 120 L 796 40 L 76 40 L 76 96" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ar-blue)" /><text x="440" y="32" class="s12 tb b c">data returned to the requesting warp</text><text x="24" y="470" class="s12 b">How a load flows:</text><text x="24" y="490" class="s12" xml:space="preserve">1. Schedulers push memory instructions into the MIO queue.</text><text x="24" y="508" class="s12" xml:space="preserve">2. LSUIN routes them: SMEM → straight to the SRAM;</text><text x="24" y="526" class="s12" xml:space="preserve">   GMEM → tag check first.</text><text x="24" y="544" class="s12" xml:space="preserve">3. Hit → read from SRAM. Miss → fetch the sector</text><text x="24" y="562" class="s12" xml:space="preserve">   from L2, store it in L1 (a future hit), then return it.</text></svg>