<text x="108.0" y="118.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="end" fill="#0f172a" font-weight="normal">addr =</text>
<text x="120.0" y="156.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#16a34a" font-weight="normal">G H I = row within</text>
<text x="120.0" y="172.8" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#16a34a" font-weight="normal">an 8-row group</text>
<text x="288.0" y="156.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#2563eb" font-weight="normal">W Y Z = which 16-B chunk</text>
<text x="288.0" y="172.8" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#2563eb" font-weight="normal">within the 128-B row</text>
<text x="466.0" y="156.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#64748b" font-weight="normal">byte within</text>
<text x="466.0" y="172.8" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#64748b" font-weight="normal">the chunk</text>
<path d="M145.0,68 C145.0,46 313.0,46 313.0,66" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
<path d="M201.0,68 C201.0,34 369.0,34 369.0,66" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
