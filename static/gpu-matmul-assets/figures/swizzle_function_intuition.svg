<text x="288.0" y="24.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7c3aed" font-weight="bold">XOR</text>
<text x="40.0" y="250.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#0f172a" font-weight="bold">Swizzle function (CuTe: Swizzle&lt;3,4,3&gt;):</text>
<text x="40.0" y="280.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="start" fill="#0f172a" font-weight="normal">f(addr) = addr XOR (((addr &gt;&gt; 7) &amp; 7) &lt;&lt; 4)</text>
<text x="40.0" y="304.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#64748b" font-weight="normal">i.e. take 3 bits starting at bit 7 and XOR them into the 3 bits starting at bit 4.</text>
<text x="40.0" y="350.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#0f172a" font-weight="bold">What gets XOR-ed, by byte range (one 128-byte row each):</text>
<rect x="40.0" y="366.0" width="82.0" height="70.0" rx="6" fill="#f1f5f9" stroke="#16a34a" stroke-width="1.5"/>
<text x="81.0" y="386.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="normal">0–127</text>
<text x="81.0" y="406.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#64748b" font-weight="normal">GHI=000</text>
<text x="81.0" y="426.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748b" font-weight="bold">XOR 0</text>
<rect x="128.0" y="366.0" width="82.0" height="70.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="169.0" y="386.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="normal">128–255</text>
<text x="169.0" y="406.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#64748b" font-weight="normal">GHI=001</text>
<text x="169.0" y="426.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">XOR 16</text>
<rect x="216.0" y="366.0" width="82.0" height="70.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="257.0" y="386.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="normal">256–383</text>
<text x="257.0" y="406.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#64748b" font-weight="normal">GHI=010</text>
<text x="257.0" y="426.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">XOR 32</text>
<rect x="304.0" y="366.0" width="82.0" height="70.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="345.0" y="386.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="normal">384–511</text>
<text x="345.0" y="406.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#64748b" font-weight="normal">GHI=011</text>
<text x="345.0" y="426.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">XOR 48</text>
<rect x="392.0" y="366.0" width="82.0" height="70.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="433.0" y="386.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="normal">512–639</text>
<text x="433.0" y="406.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#64748b" font-weight="normal">GHI=100</text>
<text x="433.0" y="426.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">XOR 64</text>
<rect x="480.0" y="366.0" width="82.0" height="70.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="521.0" y="386.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="normal">640–767</text>
<text x="521.0" y="406.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#64748b" font-weight="normal">GHI=101</text>
<text x="521.0" y="426.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">XOR 80</text>
<rect x="568.0" y="366.0" width="82.0" height="70.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="609.0" y="386.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="normal">768–895</text>
<text x="609.0" y="406.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#64748b" font-weight="normal">GHI=110</text>
<text x="609.0" y="426.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">XOR 96</text>
<rect x="656.0" y="366.0" width="82.0" height="70.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="697.0" y="386.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="normal">896–1023</text>
<text x="697.0" y="406.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#64748b" font-weight="normal">GHI=111</text>
<text x="697.0" y="426.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">XOR 112</text>
<text x="40.0" y="470.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#0f172a" font-weight="normal">Bytes 0–127 map to themselves (XOR 0). At byte 1024, GHI wraps back to 000,</text>
<text x="40.0" y="488.2" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#0f172a" font-weight="normal">so the pattern repeats every 1024 bytes = every 8 rows of 128 B.</text>
</svg>
