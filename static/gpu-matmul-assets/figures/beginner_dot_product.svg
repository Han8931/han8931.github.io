<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" role="img" aria-labelledby="title desc">
<title id="title">One output = one row paired with one column</title><desc id="desc">The first row of A and second column of B produce C[0,1]=6. Four products, one for each k, are added.</desc>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#0f172a} .mono{font-family:DejaVu Sans Mono,monospace}</style>
