<text x="135" y="390" font-size="15" style="fill:#475569" font-weight="400" text-anchor="middle">k = 0</text>
<text x="135" y="426" font-size="25" style="fill:#0f172a" font-weight="400" text-anchor="middle" class="mono">1 × 0</text>
<text x="238" y="426" font-size="24" style="fill:#0f172a" font-weight="400" text-anchor="middle">+</text>
<text x="340" y="390" font-size="15" style="fill:#475569" font-weight="400" text-anchor="middle">k = 1</text>
