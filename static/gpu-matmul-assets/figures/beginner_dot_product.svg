<text x="750" y="426" font-size="25" style="fill:#0f172a" font-weight="400" text-anchor="middle" class="mono">4 × 1</text>
<text x="450" y="475" font-size="23" style="fill:#d97706" font-weight="700" text-anchor="middle" class="mono">C[0,1] = 0 + 2 + 0 + 4 = 6</text>
<text x="450" y="506" font-size="16" style="fill:#475569" font-weight="400" text-anchor="middle">Each other C entry uses its own row/column pair.</text>
