<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img" aria-labelledby="title desc">
<title id="title">Build one output tile in two K steps</title><desc id="desc">For the top-left 2 by 2 output, the first two k values contribute [[1,2],[5,6]] and the next two contribute [[3,4],[7,8]]. Their sum is [[4,6],[12,14]].</desc>
