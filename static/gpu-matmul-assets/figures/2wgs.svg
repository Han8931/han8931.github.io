<text x="24" y="473.6" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#0f172a" font-weight="normal">4 × wgmma m64n256k16</text>
<text x="24" y="490.4" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#0f172a" font-weight="normal">(runs in parallel)</text>
<text x="24" y="546.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#64748b" font-weight="normal">Disjoint C halves avoid accumulator conflicts; both groups must finish before shared inputs are reused.</text>
<text x="24" y="562.8" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#64748b" font-weight="normal">Each holds 64×256 / 128 = 128 fp32 accumulators per thread; one group alone would need 256 (&gt; 255 limit).</text>
