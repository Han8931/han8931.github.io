<text x="24" y="303.6" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#0f172a" font-weight="normal">4 × wgmma m64n256k16</text>
<text x="24" y="440.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#0f172a" font-weight="normal">Consumer warp group 1:</text>
