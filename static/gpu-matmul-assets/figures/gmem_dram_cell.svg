<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360"><defs><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb" /></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626" /></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706" /></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a" /></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed" /></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569" /></marker><marker id="ar-idle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8" /></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155" /></marker></defs><style>
text{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0f172a;font-size:14px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.s12{font-size:12px}.s11{font-size:11px}.s16{font-size:16px}.b{font-weight:600}
.mut{fill:#64748b}.c{text-anchor:middle}.r{text-anchor:end}
.tb{fill:#2563eb}.tr{fill:#dc2626}.ta{fill:#b45309}.tg{fill:#15803d}.tp{fill:#6d28d9}
</style><rect width="100%" height="100%" fill="#ffffff" /><rect x="116" y="70" width="206" height="250" rx="16" fill="#f8fafc" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4" /><text x="219" y="340" class="s12 mut c">one DRAM cell = 1 transistor + 1 capacitor</text><line x1="40" y1="110" x2="360" y2="110" stroke="#2563eb" stroke-width="2.5" /><text x="40" y="100" class="s12 tb b">wordline</text><line x1="290" y1="40" x2="290" y2="300" stroke="#2563eb" stroke-width="2.5" /><text x="298" y="52" class="s12 tb b">bitline</text><line x1="200" y1="110" x2="200" y2="140" stroke="#0f172a" stroke-width="2" fill="none" /><line x1="178" y1="140" x2="222" y2="140" stroke="#0f172a" stroke-width="2" fill="none" /><line x1="178" y1="150" x2="222" y2="150" stroke="#0f172a" stroke-width="2" fill="none" /><polyline points="222,150 222,170 290,170" stroke="#0f172a" stroke-width="2" fill="none" /><circle cx="290" cy="170" r="4" fill="#0f172a" /><polyline points="178,150 178,170 150,170 150,215" stroke="#0f172a" stroke-width="2" fill="none" /><line x1="122" y1="215" x2="178" y2="215" stroke="#16a34a" stroke-width="3" /><line x1="122" y1="229" x2="178" y2="229" stroke="#16a34a" stroke-width="3" /><line x1="150" y1="229" x2="150" y2="262" stroke="#0f172a" stroke-width="2" fill="none" /><line x1="130.0" y1="262" x2="170.0" y2="262" stroke="#0f172a" stroke-width="2" fill="none" /><line x1="137.0" y1="269" x2="163.0" y2="269" stroke="#0f172a" stroke-width="2" fill="none" /><line x1="144.0" y1="276" x2="156.0" y2="276" stroke="#0f172a" stroke-width="2" fill="none" /><text x="238" y="136" class="s12">transistor</text><text x="186" y="226" class="s12 tg">capacitor</text><text x="170" y="288" class="s12 mut">0 V</text><rect x="400" y="30" width="376" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" /><text x="414" y="50" class="b s12">Storing a bit</text><text x="414" y="70" class="s12">Charged capacitor (V &gt; threshold) = 1, empty = 0.</text><text x="414" y="88" class="s12">Row decoder drives the wordline; sense amp reads bitline.</text><rect x="400" y="124" width="376" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" /><text x="414" y="144" class="b s12">Reading a bit</text><text x="414" y="164" class="s12">Wordline goes high → transistor opens →</text><text x="414" y="182" class="s12">the charge flows onto the bitline and is sensed.</text><rect x="400" y="218" width="376" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" /><text x="414" y="238" class="b s12">The catch: reads are destructive</text><text x="414" y="258" class="s12">Reading disturbs the charge; sense amplifiers</text><text x="414" y="276" class="s12">restore the value before the row is closed.</text><text x="400" y="326" class="s12 mut">So simple that billions fit on a chip → dense, large, slower memory.</text></svg>