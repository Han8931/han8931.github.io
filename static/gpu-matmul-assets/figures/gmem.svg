<rect x="370" y="330" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="410" y="330" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="450" y="330" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="490" y="330" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="530" y="330" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="570" y="330" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="610" y="330" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="330" y="358" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="370" y="358" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="410" y="358" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="450" y="358" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="490" y="358" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="530" y="358" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="570" y="358" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="610" y="358" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="330" y="386" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="370" y="386" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="410" y="386" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="450" y="386" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="490" y="386" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="530" y="386" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="570" y="386" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="610" y="386" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="330" y="414" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="370" y="414" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="410" y="414" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="450" y="414" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="490" y="414" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="530" y="414" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="570" y="414" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="610" y="414" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="330" y="442" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="370" y="442" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="410" y="442" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="450" y="442" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="490" y="442" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="530" y="442" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="570" y="442" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="610" y="442" width="40" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="330" y="302" width="320" height="28" fill="none" stroke="#16a34a" stroke-width="2.5"/><text x="490" y="492" class="s12 mut c">⋮  a DRAM bank has thousands of rows</text><path d="M 650 316.0 C 690 316.0, 690 147, 654 147" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ar-green)"/><text x="686" y="262.8" class="s12 tg">whole row</text><text x="686" y="278.8" class="s12 tg">copied up</text><rect x="250" y="190" width="60" height="280" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/><text x="270" y="330.0" class="s12 c" transform="rotate(-90 270 330.0)">row decoder</text><text x="302" y="209" class="s12 mut r">0</text><text x="302" y="237" class="s12 mut r">1</text><text x="302" y="265" class="s12 mut r">2</text><text x="302" y="293" class="s12 mut r">3</text><text x="302" y="321" class="s12 tg b r">4</text><text x="302" y="349" class="s12 mut r">5</text><text x="302" y="377" class="s12 mut r">6</text><text x="302" y="405" class="s12 mut r">7</text><text x="302" y="433" class="s12 mut r">8</text><text x="302" y="461" class="s12 mut r">9</text><path d="M 60 112 C 60 240, 150 316.0, 246 316.0" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ar-green)"/><line x1="310" y1="316.0" x2="328" y2="316.0" stroke="#16a34a" stroke-width="2"/><circle cx="712" cy="38" r="11" fill="#0f172a"/><text x="712" y="43" class="s12 c b" style="fill:#ffffff">1</text><text x="730" y="42" class="s12">Row bits activate one row</text><text x="730" y="60" class="s12">(its wordline goes high).</text><circle cx="712" cy="96" r="11" fill="#0f172a"/><text x="712" y="101" class="s12 c b" style="fill:#ffffff">2</text><text x="730" y="100" class="s12">The whole row is sensed</text><text x="730" y="118" class="s12">into the row buffer.</text><circle cx="712" cy="154" r="11" fill="#0f172a"/><text x="712" y="159" class="s12 c b" style="fill:#ffffff">3</text><text x="730" y="158" class="s12">Column bits select one</text><text x="730" y="176" class="s12">32 B atom from the buffer.</text><rect x="694" y="314" width="186" height="132" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="706" y="338" class="s12 b">Key insight</text><text x="706" y="358" class="s12">Opening a row is slow</text><text x="706" y="375" class="s12">(destructive read + write-</text><text x="706" y="392" class="s12">back). Reading more atoms</text><text x="706" y="409" class="s12">from an open row is fast.</text><text x="706" y="426" class="s12">→ access neighbors together.</text><rect x="24" y="516" width="852" height="104" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/><text x="40" y="538" class="s12 b tg">Advanced: what HBM adds on top (details vary by HBM generation)</text><text x="40" y="560" class="s12">• A stack = up to 16 DRAM dies joined by through-silicon vias (TSVs); a GPU has several stacks.</text><text x="40" y="576" class="s12">• Each stack: 16 independent channels, each split into 2 pseudo-channels of 32 bits.</text><text x="40" y="592" class="s12">• 32-bit pseudo-channel × burst length 8 = 32 B → the minimum transfer (the “atom”).</text><text x="40" y="608" class="s12">• All channels in parallel: 16 × 2 × 32 B = 1024 B per stack at once.</text></svg>