</style><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="40" class="s12 b">Example read address</text><text x="24" y="64" class="mono s16"><tspan class="tg">0000000000100</tspan> <tspan class="tb">010</tspan></text><text x="24" y="86" class="s12 tg">row bits → row 4</text><text x="24" y="104" class="s12 tb">column bits → atom 2</text><rect x="330" y="30" width="320" height="44" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/><text x="490" y="57" class="c">column decoder</text><path d="M 185 100 C 240 100, 260 52, 326 52" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar-blue)"/><rect x="330" y="92" width="40" height="28" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/><text x="350.0" y="111" class="s12 c">0</text><rect x="370" y="92" width="40" height="28" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/><text x="390.0" y="111" class="s12 c">1</text><rect x="410" y="92" width="40" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="430.0" y="111" class="s12 c">2</text><rect x="450" y="92" width="40" height="28" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/><text x="470.0" y="111" class="s12 c">3</text><rect x="490" y="92" width="40" height="28" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/><text x="510.0" y="111" class="s12 c">4</text><rect x="530" y="92" width="40" height="28" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/><text x="550.0" y="111" class="s12 c">5</text><rect x="570" y="92" width="40" height="28" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/><text x="590.0" y="111" class="s12 c">6</text><rect x="610" y="92" width="40" height="28" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/><text x="630.0" y="111" class="s12 c">7</text><line x1="430.0" y1="74" x2="430.0" y2="90" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar-blue)"/><rect x="330" y="130" width="320" height="34" rx="8" fill="#ede9fe" stro